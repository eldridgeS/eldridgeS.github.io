site:
  name: LightningX
  site: 'https://lightningx-da.com'
  base: '/'
  trailingSlash: false

  # googleSiteVerificationId:

# Default SEO metadata
metadata:
  title:
    default: LightningX
    template: '%s — LightningX'
  description: 'Accelerate your time-to-market with cutting-edge design automation technology from LightningX.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: LightningX
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website

i18n:
  language: en
  textDirection: ltr

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
